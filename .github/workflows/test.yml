name: Test public clients

on:
  push:
  pull_request:

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.12']
        exclude:
          - os: ubuntu-latest
            python-version: '3.9'
        include:
          # Python 3.9 builds are unavailable for Ubuntu 26.04 (ubuntu-latest).
          - os: ubuntu-22.04
            python-version: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax and unit tests
        run: |
          python -m py_compile app.py
          python -m unittest discover -s tests -v
