[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gecici-email"
version = "1.0.0"
description = "Autonomous AI Agent-native disposable email client with smart OTP and magic link extraction."
readme = "README.md"
authors = [{ name = "gecici.email", email = "support@gecici.email" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0"
]
keywords = ["disposable-email", "temp-mail", "ai-agents", "mcp", "otp-extractor", "langchain", "crewai"]

[project.optional-dependencies]
langchain = ["langchain>=0.1.0", "pydantic>=2.0.0"]
crewai = ["crewai>=0.1.0", "pydantic>=2.0.0"]

[project.urls]
Homepage = "https://gecici.email"
Documentation = "https://gecici.email/api-dokuman"
"LLM Spec" = "https://gecici.email/llms.txt"
